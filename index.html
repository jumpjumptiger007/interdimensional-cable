<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0908">
  <title>Interdimensional Cable</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="room">
    <div class="room-glow" aria-hidden="true"></div>

    <section class="console" aria-label="Interdimensional Cable television">
      <div class="tv-set" id="tvSet">
        <div class="tv-shell">
          <div class="tv-top-vents" aria-hidden="true"></div>

          <div class="tv-face">
            <div class="crt-frame">
              <div class="crt-bezel">
                <div class="tv-screen" id="tvScreen">
                  <canvas id="noiseCanvas" aria-hidden="true"></canvas>
                  <div class="power-off-overlay" id="powerOverlay" aria-hidden="true">
                    <span class="power-off-dot"></span>
                  </div>

                  <div id="player"></div>

                  <div class="channel-display" id="channelDisplay">CH 01</div>

                  <div class="crt-vignette" aria-hidden="true"></div>
                  <div class="scanlines" aria-hidden="true"></div>
                  <div class="screen-glare" aria-hidden="true"></div>
                  <div class="glass-reflection" aria-hidden="true"></div>
                </div>
              </div>
            </div>

            <aside class="tv-controls" aria-label="Television hardware">
              <div class="speaker-grille speaker-grille--tall" aria-hidden="true"></div>

              <div class="hardware-cluster">
                <div class="hardware-label">POWER</div>
                <div class="power-indicator" aria-hidden="true">
                  <span class="brand-light" id="powerLed"></span>
                </div>

                <div class="dial" aria-hidden="true">
                  <span class="dial-notch"></span>
                </div>
                <div class="hardware-label hardware-label--dial">TUNING</div>
              </div>
            </aside>
          </div>

          <div class="tv-lower-panel">
            <div class="speaker-grille speaker-grille--wide" aria-hidden="true"></div>

            <div class="brand-plate">
              <span class="brand-name">INTERDIMENSIONAL</span>
              <span class="brand-sub">CABLE</span>
              <span class="brand-mark" aria-hidden="true">
                <i></i><i></i><i></i>
              </span>
            </div>

            <div class="model-label">MODEL IC-137 · MULTIVERSE RECEIVER</div>
          </div>
        </div>

        <div class="tv-feet" aria-hidden="true">
          <span></span>
          <span></span>
        </div>
      </div>

      <aside class="remote-wrap">
        <div class="remote-control" id="remoteControl" aria-label="Remote control">
          <div class="remote-sensor" aria-hidden="true"></div>
          <div class="remote-header">
            <span class="remote-title">IC</span>
            <span class="remote-model">R-137</span>
          </div>

          <button class="remote-btn remote-btn--power" id="btnPower" type="button" aria-label="Power">
            <span class="power-symbol" aria-hidden="true"></span>
          </button>

          <section class="remote-section" aria-label="Channel controls">
            <span class="remote-label">CHANNEL</span>
            <div class="rocker rocker--vertical">
              <button class="remote-btn rocker-btn rocker-btn--top" id="btnChannelNext" type="button" aria-label="Next channel">
                <span class="chevron chevron--up" aria-hidden="true"></span>
              </button>
              <div class="rocker-mid">CH</div>
              <button class="remote-btn rocker-btn rocker-btn--bottom" id="btnChannelPrev" type="button" aria-label="Previous channel">
                <span class="chevron chevron--down" aria-hidden="true"></span>
              </button>
            </div>
          </section>

          <section class="remote-section remote-section--volume" aria-label="Volume controls">
            <span class="remote-label">VOLUME</span>
            <div class="volume-row">
              <button class="remote-btn remote-btn--small" id="btnVolDown" type="button" aria-label="Volume down">−</button>
              <button class="remote-btn remote-btn--small" id="btnVolUp" type="button" aria-label="Volume up">+</button>
            </div>
          </section>

          <div class="remote-actions">
            <button class="remote-btn remote-btn--utility" id="btnMute" type="button" aria-label="Mute">
              <span class="mute-icon" aria-hidden="true">◖</span>
              <span>MUTE</span>
            </button>

            <button class="remote-btn remote-btn--random active" id="btnRandom" type="button" aria-label="Random start">
              RND
            </button>
          </div>

          <div class="remote-footer">
            <span>INTERDIMENSIONAL</span>
            <strong>CABLE</strong>
          </div>
        </div>
      </aside>
    </section>

    <p class="room-caption">RETRO TECH. INFINITE CHANNELS.</p>
  </main>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
