name: Update Reddit Videos

on:
  schedule:
    # 每天 UTC 时间 0:00 (北京时间 8:00) 自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub 界面手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Videos
        run: python scripts/fetch_reddit.py

      - name: Validate available videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/validate_videos.py

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: auto update videos.json" && git push)
